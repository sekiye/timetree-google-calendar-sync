name: Sync TimeTree to Google Calendar

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */2 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: timetree-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: src

      TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
      TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
      TIMETREE_CALENDAR_URL: ${{ secrets.TIMETREE_CALENDAR_URL }}
      TIMETREE_CALENDAR_NAME: ${{ secrets.TIMETREE_CALENDAR_NAME }}
      TARGET_NAME: ${{ secrets.TARGET_NAME }}

      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Restore Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          GOOGLE_CREDENTIALS_FILE="$RUNNER_TEMP/google-service-account.json"

          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" \
            | base64 --decode \
            > "$GOOGLE_CREDENTIALS_FILE"

          chmod 600 "$GOOGLE_CREDENTIALS_FILE"

          echo "GOOGLE_SERVICE_ACCOUNT_JSON=$GOOGLE_CREDENTIALS_FILE" \
            >> "$GITHUB_ENV"

      - name: Sync TimeTree to Google Calendar
        run: |
          xvfb-run -a python -m timetree_sync.sync_create_update